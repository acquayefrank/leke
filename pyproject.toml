[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "leke"
version = "0.1.0"
description = "High-performance subword tokenizer for Kwa languages (Akan/Twi, Ewe, Ga, Fante)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Frank Acquaye", email = "acquayefrank@gmail.com" }]
license = { text = "Apache-2.0" }
dependencies = [
    "tokenizers>=0.19.0",
    "transformers>=4.40.0",
    "pytest>=8.0.0",
    "tabulate>=0.9.0",
    "maturin>=1.7.0",
    "ruff>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.maturin]
module-name = "leke._leke"
python-source = "python"
features = ["pyo3/extension-module", "pyo3/abi3-py39"]

