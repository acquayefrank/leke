[package]
name = "leke"
version = "0.1.0"
edition = "2021"
authors = ["Frank Acquaye <acquayefrank@gmail.com>"]
description = "High-performance subword tokenizer for Kwa languages (Akan/Twi, Ewe, Ga, Fante)"
readme = "README.md"
license = "Apache-2.0"

[lib]
name = "_leke"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
tokenizers = { version = "0.20" }
unicode-normalization = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
