name: Release

# Builds abi3 wheels (Linux, macOS, Windows) and an sdist, installs each wheel on a clean
# runner, then publishes to PyPI and creates a GitHub release when a v* tag is pushed.
# Running it by hand (workflow_dispatch), or a pull request that touches packaging, does
# everything except publishing, as a dry run.
# PyPI publishing uses trusted publishing: no token secret, but the PyPI project must list
# this repository, this workflow file and the "pypi" environment as a trusted publisher.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  check-version:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare tag, pyproject.toml and Cargo.toml versions
        run: |
          py_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          rs_version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          echo "pyproject.toml: $py_version, Cargo.toml: $rs_version"
          if [ "$py_version" != "$rs_version" ]; then
            echo "::error::pyproject.toml ($py_version) and Cargo.toml ($rs_version) disagree."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$py_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version v$py_version."
            exit 1
          fi

  wheels:
    name: Wheel (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v5
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/*.tar.gz

  smoke-test:
    name: Install wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v5
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install leke from the built wheels only
        shell: bash
        run: |
          python -m pip install tabulate
          python -m pip install --no-index --find-links dist leke
      - name: Normalize, encode and decode with the shipped tokenizer
        shell: bash
        # Run from a temp dir so `import leke` resolves to the installed wheel, not ./python.
        working-directory: ${{ runner.temp }}
        env:
          PYTHONUTF8: "1"  # Windows consoles default to cp1252, which can't print byte-level tokens
        run: |
          python - "$GITHUB_WORKSPACE/models/bpe-16k/tokenizer.json" <<'PY'
          import sys

          import leke

          assert leke.normalize("Wͻfrɛ me Kofi") == "Wɔfrɛ me Kofi"
          tok = leke.LekeTokenizer.from_file(sys.argv[1])
          enc = tok.encode("Akwaaba ba Ghana man mu!")
          assert tok.decode(enc.ids) == "Akwaaba ba Ghana man mu!"
          print(leke.__version__, leke.__file__, enc.tokens)
          PY

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, check-version, smoke-test, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/leke/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create release with the wheels and sdist attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --title "Leke $GITHUB_REF_NAME"
