name: Publish tokenizer to Hugging Face

# Uploads models/bpe-16k and models/bpe-32k to https://huggingface.co/acquayefrank/leke-bpe-16k
# and https://huggingface.co/acquayefrank/leke-bpe-32k whenever a model bundle changes on
# main, after the test suite passes. Each upload is a no-op on the Hub if nothing changed.
# Requires a repository secret HF_TOKEN with write access to the Hugging Face repo.

on:
  push:
    branches: ["main"]
    paths:
      - "models/bpe-16k/**"
      - "models/bpe-32k/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-hf
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: ["bpe-16k", "bpe-32k"]
    environment: huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check HF_TOKEN is configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Repository secret HF_TOKEN is not set."
            exit 1
          fi
      - name: Verify the bundle loads and matches its receipt
        run: |
          uv run --no-project --with tokenizers python - <<'PY'
          import json
          from tokenizers import Tokenizer

          tok = Tokenizer.from_file("models/${{ matrix.model }}/tokenizer.json")
          receipt = json.load(open("models/${{ matrix.model }}/training_receipt.json"))
          assert tok.get_vocab_size() == receipt["actual_vocab_size"], "vocab size mismatch"
          print("OK:", tok.encode("Akwaaba ba Ghana man mu.").tokens)
          PY
      - name: Upload to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >
          uv run --no-project --with huggingface_hub python scripts/upload_hf.py
          --model-dir models/${{ matrix.model }} --repo-id acquayefrank/leke-${{ matrix.model }}
          --commit-message "Sync models/${{ matrix.model }} from ${{ github.repository }}@${{ github.sha }}"
